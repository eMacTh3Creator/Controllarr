name: ControllarrRemote
options:
  bundleIdPrefix: com.controllarr
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  ControllarrRemote:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.controllarr.remote
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Controllarr
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Find and manage your Controllarr servers on your local network.
        NSBonjourServices: ["_controllarr._tcp"]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.controllarr.remote.refresh]
        ITSAppUsesNonExemptEncryption: false
  ControllarrRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ControllarrRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ControllarrRemoteMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: [Assets.xcassets]
      - Mac/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: ControllarrRemote
        PRODUCT_BUNDLE_IDENTIFIER: com.controllarr.remote.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Mac/ControllarrRemote.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: "arm64 x86_64"
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Controllarr Remote
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: Find and manage your Controllarr servers on your local network.
        NSBonjourServices: ["_controllarr._tcp"]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationCategoryType: public.app-category.utilities
schemes:
  ControllarrRemote:
    build:
      targets:
        ControllarrRemote: all
    test:
      targets: [ControllarrRemoteTests]
  ControllarrRemoteMac:
    build:
      targets:
        ControllarrRemoteMac: all
